name: helm
on:
  push:
    branches:
      - main
      - release/*
      - snapshot/*
    tags:
      - v*
    paths:
      - charts/**
      - Makefile
      - Makefile.tools
  pull_request:
    paths:
      - charts/**
      - Makefile
      - Makefile.tools
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref_name != 'main' }}

jobs:
  lint:
    name: "lint and validate chart"
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - uses: perses/github-actions@v0.11.0
      - uses: ./.github/perses-ci/actions/setup_environment
        with:
          enable_go: true
      - name: lint chart
        run: make helm-lint
      - name: template chart
        run: make helm-template
  deploy:
    name: "deploy chart to kind"
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: import environment variables
        run: cat .github/env >> "$GITHUB_ENV"
      - uses: perses/github-actions@v0.11.0
      - uses: ./.github/perses-ci/actions/setup_environment
        with:
          enable_go: true
      - name: create kind cluster
        uses: helm/kind-action@v1.14.0
        with:
          version: ${{ env.kind-version }}
          cluster_name: perses-helm-test
          node_image: ${{ env.kind-image }}
          wait: 5m
      - name: deploy operator via helm
        run: make helm-e2e-deploy
      - name: collect debug info on failure
        if: failure()
        run: |
          echo "=== Helm release status ==="
          make helm-status || true
          echo ""
          echo "=== Operator logs ==="
          kubectl logs -n perses-operator-system deployment/perses-operator-controller-manager --tail=200 || true
          echo ""
          echo "=== Events ==="
          kubectl get events -n perses-operator-system --sort-by='.lastTimestamp' | tail -50 || true
          echo ""
          echo "=== Pods ==="
          kubectl get pods -n perses-operator-system -o wide || true
